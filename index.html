<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Пам'ятників</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="constructor-container">
        
        <div class="visual-block">
            <div class="monument-preview">

                <div class="layer layer-arka" id="layerArka">
                    <div class="engraving-preview" id="engravingText">Прізвище Ім'я</div>
                </div>
                
                <div class="layer layer-tumba" id="layerTumba"></div>
                <div class="layer layer-plate" id="layerPlate"></div>
                <div class="layer layer-base" id="layerBase"></div>
                <div class="layer layer-decor" id="layerDecor"></div>

            </div>
        </div>

        <div class="menu-block">
            <h2>Конструктор Пам'ятника</h2>
            <hr>

            <div class="menu-section">
                <label>Основний матеріал (Камінь):</label>
                <div class="buttons-grid">
                    <button class="btn active" onclick="setStone('gabro', this)">Габро (Чорний)</button>
                    <button class="btn" onclick="setStone('pokost', this)">Покостівка (Сірий)</button>
                </div>
            </div>

            <div class="menu-section">
                <label>Форма Арки (Стели):</label>
                <div class="buttons-grid">
                    <button class="btn active" onclick="setArka('priama', this)">Пряма []</button>
                    <button class="btn" onclick="setArka('khvylka', this)">Хвилька [~]</button>
                    <button class="btn" onclick="setArka('kosa', this)">Коса [/\].</button>
                </div>
            </div>

            <div class="menu-section">
                <label>Низ / Облицювання цоколя:</label>
                <div class="buttons-grid">
                    <button class="btn active" onclick="setBase('obklady', this)">Обклади каменем</button>
                    <button class="btn" onclick="setBase('plytka', this)">Плитка керамічна</button>
                </div>
            </div>

            <div class="menu-section">
                <label>Художнє оформлення:</label>
                <input type="text" id="clientName" placeholder="Введіть ПІБ для прев'ю" oninput="updateText()">
                <div class="upload-box">
                    <input type="file" id="photoUpload" accept="image/*">
                    <label for="photoUpload">📷 Завантажити фото портрета</label>
                </div>
            </div>

            <div class="menu-section">
                <label>Додаткові аксесуари:</label>
                <div class="buttons-grid">
                    <button class="btn toggle-btn" onclick="toggleAccessory('lampadka', this)">Лампадка</button>
                    <button class="btn toggle-btn" onclick="toggleAccessory('vaza', this)">Ваза</button>
                </div>
            </div>

            <div class="total-price-block">
                <div class="price-title">Попередній розрахунок:</div>
                <div class="price-value" id="totalPrice">45 000 грн</div>
                <button class="btn-order" onclick="sendOrder()">Розрахувати & Замовити</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
